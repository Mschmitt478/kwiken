name: Build release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - chromium-fork/VERSION
      - chromium-fork/PACKAGE_REVISION

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: .\chromium-fork\scripts\build-distribution.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content .\chromium-fork\VERSION -Raw).Trim()
          $packageRevision = (Get-Content .\chromium-fork\PACKAGE_REVISION -Raw).Trim()
          $releaseVersion = "$version-r$packageRevision"
          $tag = "v$releaseVersion"
          $installer = ".\chromium-fork\release\Kwiken-Setup-$releaseVersion.exe"
          $sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()

          @"
          ## Kwiken $releaseVersion

          Native Windows Chromium browser with Kwiken vertical tabs, branding,
          default-app registration, session restore, extension-store support,
          and lightweight defaults. This revision defaults new profiles to
          aggressive Memory Saver with no speculative preloading or background
          residency, and removes Chromium's idle spare renderer without
          weakening isolation.

          **Installer SHA-256:** ``$sha256``

          The installer is currently unsigned, so Windows SmartScreen may show
          an unknown-publisher warning.
          "@ | Set-Content .\release-notes.md

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer --clobber
            gh release edit $tag --title "Kwiken $releaseVersion" --notes-file .\release-notes.md
          } else {
            gh release create $tag $installer --target $env:GITHUB_SHA --title "Kwiken $releaseVersion" --notes-file .\release-notes.md
          }
